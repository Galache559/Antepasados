<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GALACHE - Árbol Genealógico Familiar</title>

<style>

:root{
  --bg:#10151c;
  --card:#1b2430;
  --card2:#202b38;
  --line:#334354;
  --gold:#d8b36a;
  --gold2:#f0cf88;
  --text:#f2f4f7;
  --muted:#aeb8c4;
  --green:#75c99a;
  --blue:#73a9df;
  --red:#e58b8b;
  --purple:#c98db7;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:18px;
}


/* =========================================================
   CABECERA
========================================================= */

.header{
  background:linear-gradient(145deg,#1b2531,#141b24);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  flex-direction:column;
  text-align:center;
}

.escudo{
  width:82px;
  height:82px;
  border-radius:50%;
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:none;
  background:#111820;
}

.escudo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.escudo-default{
  color:var(--gold);
  font-size:38px;
  font-weight:bold;
}

.header-title h1{
  margin:0;
  color:var(--gold2);
  font-size:30px;
  letter-spacing:3px;
}

.header-note{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}


/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:16px;
  overflow-x:auto;
  padding-bottom:2px;
}

.tab{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:10px;
  padding:10px 15px;
  white-space:nowrap;
}

.tab.active{
  background:var(--gold);
  color:#15191e;
  border-color:var(--gold);
  font-weight:bold;
}


/* =========================================================
   PANELES
========================================================= */

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.section{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.section h2{
  margin:0 0 15px;
  color:var(--gold2);
  font-size:21px;
}


/* =========================================================
   CABECERA DEL ÁRBOL
========================================================= */

.tree-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.tree-header h2{
  margin:0;
}


/* =========================================================
   ÁRBOL
========================================================= */

.tree{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.generation{
  width:100%;
  text-align:center;
}

.generation-title{
  color:var(--gold);
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:6px 0 10px;
}

.tree-row{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:14px;
  flex-wrap:wrap;
  width:100%;
}

.connector{
  height:25px;
  width:2px;
  background:var(--line);
  margin:auto;
}

.person-card{
  width:330px;
  max-width:100%;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  text-align:left;
  position:relative;
  transition:.15s;
  cursor:pointer;
}

.person-card:hover{
  transform:translateY(-2px);
  border-color:var(--gold);
}

.person-card.male{
  border-left:4px solid var(--blue);
}

.person-card.female{
  border-left:4px solid var(--purple);
}

.person-card.galache{
  border:2px solid var(--gold);
}

.person-card.current{
  border:2px solid var(--gold2);
  box-shadow:0 0 0 1px rgba(216,179,106,.15);
}

.person-name{
  color:var(--text);
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}

.person-meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.person-meta strong{
  color:#d7dde5;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  margin-top:9px;
  background:#293442;
}

.badge.confirmado{
  color:var(--green);
}

.badge.pendiente{
  color:var(--gold2);
}

.tree-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  max-width:700px;
  line-height:1.5;
  margin:14px auto 0;
}


/* =========================================================
   AÑADIR ANTEPASADO
========================================================= */

.add-ancestor{
  margin-top:12px;
  padding:14px;
  border:1px dashed var(--gold);
  border-radius:13px;
  background:rgba(216,179,106,.05);
  text-align:center;
}

.add-ancestor-title{
  color:var(--gold2);
  font-weight:bold;
  margin-bottom:5px;
}

.add-ancestor-text{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}


/* =========================================================
   PERSONAS
========================================================= */

.personas-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:12px;
}

.persona-item{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.persona-item.galache-item{
  border-left:3px solid var(--gold);
}

.persona-item.current-item{
  border-left:3px solid var(--gold2);
}

.persona-item .actions{
  display:flex;
  gap:7px;
  margin-top:12px;
  flex-wrap:wrap;
}


/* =========================================================
   BOTONES
========================================================= */

.btn{
  border:1px solid var(--line);
  background:#263240;
  color:var(--text);
  border-radius:9px;
  padding:8px 11px;
}

.btn:hover{
  border-color:var(--gold);
}

.btn.gold{
  background:var(--gold);
  color:#111820;
  border-color:var(--gold);
  font-weight:bold;
}

.btn.red{
  color:var(--red);
}

.btn.green{
  color:var(--green);
}


/* =========================================================
   FORMULARIO
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#121a22;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--gold);
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}


/* =========================================================
   COPIA
========================================================= */

.backup-box{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.backup-card{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

.backup-card h3{
  margin-top:0;
  color:var(--gold2);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:1000;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:850px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin:20px auto;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  color:var(--gold2);
}

.close{
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  width:36px;
  height:36px;
  border-radius:9px;
  font-size:20px;
}

.detail-box{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
}

.detail-row{
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:14px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:var(--muted);
}

.detail-value{
  color:var(--text);
  font-weight:bold;
}


/* =========================================================
   MENSAJES
========================================================= */

.empty{
  color:var(--muted);
  text-align:center;
  padding:25px;
}

.small{
  color:var(--muted);
  font-size:12px;
}


/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:700px){

  .app{
    padding:10px;
  }

  .header{
    padding:14px;
  }

  .escudo{
    width:72px;
    height:72px;
  }

  .header-title h1{
    font-size:24px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .person-card{
    width:100%;
  }

  .tree-row{
    flex-direction:column;
    align-items:center;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     CABECERA
===================================================== -->

<header class="header">

  <div class="header-top">

    <div class="escudo" id="escudo">
      <div class="escudo-default">G</div>
    </div>

    <div class="header-title">

      <h1>GALACHE</h1>

      <div class="header-note">
        Árbol Genealógico Familiar
      </div>

    </div>

  </div>

</header>


<!-- =====================================================
     TABS
===================================================== -->

<nav class="tabs">

  <button class="tab active" data-tab="arbol">
    Árbol
  </button>

  <button class="tab" data-tab="personas">
    Personas
  </button>

  <button class="tab" data-tab="copia">
    Copia
  </button>

</nav>


<!-- =====================================================
     ÁRBOL
===================================================== -->

<main id="arbol" class="panel active">

<section class="section">

  <div class="tree-header">

    <h2>Árbol familiar</h2>

    <button class="btn gold" onclick="nuevaPersona(true)">
      + Añadir antepasado
    </button>

  </div>

  <div id="tree" class="tree"></div>

</section>

</main>


<!-- =====================================================
     PERSONAS
===================================================== -->

<main id="personas" class="panel">

<section class="section">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  ">

    <h2 style="margin-bottom:0">
      Personas
    </h2>

    <button class="btn gold" onclick="nuevaPersona(false)">
      + Nueva persona
    </button>

  </div>

  <div
    id="personasGrid"
    class="personas-grid"
    style="margin-top:15px">
  </div>

</section>

</main>


<!-- =====================================================
     COPIA
===================================================== -->

<main id="copia" class="panel">

<section class="section">

  <h2>Copia de seguridad</h2>

  <div class="backup-box">


    <div class="backup-card">

      <h3>Exportar</h3>

      <p class="small">
        Guarda todos los datos actuales de Antepasados
        en un archivo JSON.
      </p>

      <button
        class="btn gold"
        onclick="exportarJSON()">

        Exportar JSON

      </button>

    </div>


    <div class="backup-card">

      <h3>Importar</h3>

      <p class="small">
        Recupera una copia JSON anteriormente guardada.
      </p>

      <input
        id="archivoImportar"
        type="file"
        accept=".json,application/json"
        style="margin-top:8px">

      <button
        class="btn green"
        onclick="importarJSON()"
        style="margin-top:8px">

        Importar

      </button>

    </div>


    <div class="backup-card">

      <h3>Restaurar</h3>

      <p class="small">
        Vuelve a los datos iniciales incluidos en la aplicación.
      </p>

      <button
        class="btn red"
        onclick="restaurarInicial()">

        Restaurar datos iniciales

      </button>

    </div>


  </div>

</section>

</main>


</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Persona
      </h2>

      <button
        class="close"
        onclick="cerrarModal()">

        ×

      </button>

    </div>


    <div id="modalContent"></div>

  </div>

</div>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const STORAGE_KEY = "antepasados_galache_v6";


/* =========================================================
   UTILIDADES
========================================================= */

function uid(){

  return "p_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);

}


function esc(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function texto(valor){

  return valor == null ? "" : String(valor);

}


function guardar(){

  localStorage.setItem(
    STORAGE_KEY,

  );

}


function cargar(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(raw){

      const data = JSON.parse(raw);

      if(
        data &&
        typeof data === "object" &&
        Array.isArray(data.personas)
      ){

        return normalizarDB(data);

      }

    }

  }catch(e){

    console.error(
      "Error cargando datos:",
      e
    );

  }

  return crearDBInicial();

}


/* =========================================================
   PERSONA
========================================================= */

function persona(datos={}){

  return {

    id:
      datos.id ||
      uid(),

    nombre:
      datos.nombre ||
      "",

    apellidos:
      datos.apellidos ||
      "",

    variantes:
      datos.variantes ||
      "",

    estado:
      datos.estado ||
      "Confirmado",

    nacimiento:
      datos.nacimiento ||
      "",

    lugarNacimiento:
      datos.lugarNacimiento ||
      "",

    matrimonio:
      datos.matrimonio ||
      "",

    lugarMatrimonio:
      datos.lugarMatrimonio ||
      "",

    padre:
      datos.padre ||
      "",

    madre:
      datos.madre ||
      "",

    conyuge:
      datos.conyuge ||
      "",

    hijos:
      datos.hijos ||
      "",

    notas:
      datos.notas ||
      "",

    sexo:
      datos.sexo ||
      "",

    galache:
      !!datos.galache,

    actual:
      !!datos.actual

  };

}


/* =========================================================
   NORMALIZAR
========================================================= */

function normalizarPersonas(personas){

  return personas.map(p => {

    p.id =
      p.id ||
      uid();

    p.nombre =
      p.nombre || "";

    p.apellidos =
      p.apellidos || "";

    p.variantes =
      p.variantes || "";

    p.estado =
      p.estado ||
      "Confirmado";

    p.nacimiento =
      p.nacimiento || "";

    p.lugarNacimiento =
      p.lugarNacimiento || "";

    p.matrimonio =
      p.matrimonio || "";

    p.lugarMatrimonio =
      p.lugarMatrimonio || "";

    p.padre =
      p.padre || "";

    p.madre =
      p.madre || "";

    p.conyuge =
      p.conyuge || "";

    p.hijos =
      p.hijos || "";

    p.notas =
      p.notas || "";

    p.sexo =
      p.sexo || "";

    p.galache =
      !!p.galache;

    p.actual =
      !!p.actual;

    return p;

  });

}


function normalizarDB(data){

  data.personas =
    normalizarPersonas(
      Array.isArray(data.personas)
        ? data.personas
        : []
    );

  return data;

}

/* =========================================================
   NOMBRE COMPLETO
========================================================= */

function nombreCompleto(p){

  return [
    p.nombre,
    p.apellidos
  ]
    .filter(Boolean)
    .join(" ")
    .trim();

}


/* =========================================================
   BUSCAR PERSONA POR NOMBRE
========================================================= */

function buscarPersonaPorNombre(nombre){

  const objetivo =
    String(nombre || "")
      .trim()
      .toLowerCase();

  if(!objetivo){

    return null;

  }

  return db.personas.find(p => {

    return nombreCompleto(p)
      .toLowerCase() === objetivo;

  }) || null;

}

/* =========================================================
   RENDER ÁRBOL
========================================================= */

function renderArbol(){

  const tree =
    document.getElementById("tree");

  if(!tree){

    return;

  }

  let html = "";


  generaciones.forEach(
    (gen,index) => {

      const validos =
        gen.personas
          .map(getPersona)
          .filter(Boolean);


      if(!validos.length){

        return;

      }


      html += `

        <div class="generation">

          <div class="generation-title">
            ${esc(gen.titulo)}
          </div>

          <div class="tree-row">

      `;


      validos.forEach(p => {

        const claseSexo =
          p.sexo === "F"
            ? "female"
            : "male";

        const galache =
          p.galache
            ? "galache"
            : "";

        const actual =
          p.actual
            ? "current"
            : "";


        html += `

          <div
            class="person-card ${claseSexo} ${galache} ${actual}"
            onclick="mostrarDetalle('${p.id}')">

            <div class="person-name">
              ${esc(nombreCompleto(p))}
            </div>

            <div class="person-meta">

              ${
                p.nacimiento
                  ? `<div><strong>Nacimiento:</strong> ${esc(p.nacimiento)}</div>`
                  : ""
              }

              ${
                p.lugarNacimiento
                  ? `<div><strong>Lugar:</strong> ${esc(p.lugarNacimiento)}</div>`
                  : ""
              }

              ${
                p.conyuge
                  ? `<div><strong>Cónyuge:</strong> ${esc(p.conyuge)}</div>`
                  : ""
              }

            </div>

            <span class="badge ${
              p.estado === "Pendiente"
                ? "pendiente"
                : "confirmado"
            }">
              ${esc(p.estado)}
            </span>

          </div>

        `;

      });


      html += `

          </div>

        </div>

      `;


      if(index < generaciones.length - 1){

        html += `
          <div class="connector"></div>
        `;

      }

    }
  );


  html += `

    <div class="tree-note">

      Árbol principal de la investigación familiar GALACHE.
      Las generaciones pendientes se irán incorporando
      a medida que aparezcan nuevas fuentes documentales.

    </div>

    <div class="add-ancestor">

      <div class="add-ancestor-title">
        ¿Continuamos hacia atrás?
      </div>

      <div class="add-ancestor-text">
        Puedes añadir aquí nuevos antepasados
        de Francisco Galache Fraile.
      </div>

      <button
        class="btn gold"
        onclick="nuevaPersona(true)">

        + Añadir antepasado

      </button>

    </div>

  `;


  tree.innerHTML = html;

}

function renderPersonas(){

  const grid =
    document.getElementById(
      "personasGrid"
    );

  if(!grid){

    return;

  }


  if(!db.personas.length){

    grid.innerHTML =
      `<div class="empty">
        No hay personas registradas.
      </div>`;

    return;

  }


  const ordenadas =
    [...db.personas]
      .sort((a,b) =>
        nombreCompleto(a)
          .localeCompare(
            nombreCompleto(b),
            "es"
          )
      );


  grid.innerHTML =
    ordenadas.map(p => {

      const clase =
        p.actual
          ? "current-item"
          : (
              p.galache
                ? "galache-item"
                : ""
            );


      return `

        <div
          class="persona-item ${clase}">

          <div class="person-name">
            ${esc(nombreCompleto(p))}
          </div>

          <div class="person-meta">

            ${
              p.nacimiento
                ? `<div><strong>Nacimiento:</strong> ${esc(p.nacimiento)}</div>`
                : ""
            }

            ${
              p.lugarNacimiento
                ? `<div><strong>Lugar:</strong> ${esc(p.lugarNacimiento)}</div>`
                : ""
            }

            ${
              p.conyuge
                ? `<div><strong>Cónyuge:</strong> ${esc(p.conyuge)}</div>`
                : ""
            }

            ${
              p.estado
                ? `<div><strong>Estado:</strong> ${esc(p.estado)}</div>`
                : ""
            }

          </div>


          <div class="actions">

            <button
              class="btn"
              onclick="mostrarDetalle('${p.id}')">

              Ver ficha

            </button>

            <button
              class="btn"
              onclick="editarPersona('${p.id}')">

            <button
              class="btn red"
              onclick="eliminarPersona('${p.id}')">

    }).join("");

}

            .toLowerCase()
            .includes("galache");


        guardar();

        cerrarModal();

        render();

      }
    );


  abrirModal();

}


/* =========================================================
   ELIMINAR PERSONA
========================================================= */

function eliminarPersona(id){

  const p =
    getPersona(id);

  if(!p){

    return;

  }


  if(
    !confirm(
      "¿Eliminar a " +
      nombreCompleto(p) +
      "?"
    )
  ){

    return;

  }


  db.personas =
    db.personas.filter(
      x => x.id !== id
    );


  guardar();

  render();

}


/* =========================================================
   EXPORTAR JSON
========================================================= */

function exportarJSON(){

  const contenido =
    JSON.stringify(
      db,
      null,
      2
    );


  const blob =
    new Blob(
      [contenido],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  const fecha =
    new Date()
      .toISOString()
      .slice(0,10);


  a.href = url;

  a.download =
    "antepasados_galache_" +
    fecha +
    ".json";


  document
    .body
    .appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORTAR JSON
========================================================= */

function importarJSON(){

  const input =
    document
      .getElementById(
        "archivoImportar"
      );


  if(
    !input ||
    !input.files ||
    !input.files[0]
  ){

    alert(
      "Selecciona primero un archivo JSON."
    );

    return;

  }


  const file =
    input.files[0];


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !data ||
          !Array.isArray(
            data.personas
          )
        ){

          throw new Error(
            "Formato no válido"
          );

        }


        db =
          normalizarDB(data);


        guardar();

        render();


        alert(
          "Datos importados correctamente."
        );


        input.value = "";


      }catch(error){

        console.error(error);

        alert(
          "No se ha podido importar el archivo JSON."
        );

      }

    };


  reader.readAsText(
    file,
    "utf-8"
  );

}


/* =========================================================
   RESTAURAR INICIAL
========================================================= */

function restaurarInicial(){

  if(
    !confirm(
      "¿Quieres restaurar los datos iniciales? Se perderán los cambios actuales que no estén en una copia JSON."
    )
  ){

    return;

  }


  db =
    crearDBInicial();


  guardar();

  render();


  alert(
    "Datos iniciales restaurados."
  );

}


/* =========================================================
   ESCUDO
========================================================= */

function cargarEscudo(){

  const escudo =
    document.getElementById(
      "escudo"
    );


  if(!escudo){

    return;

  }


  if(db.escudo){

    escudo.innerHTML = `

      <img
        src="${esc(db.escudo)}"
        alt="Escudo GALACHE">

    `;

  }else{

    escudo.innerHTML =
      `<div class="escudo-default">G</div>`;

  }

}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

render();

cargarEscudo();


</script>
