<!DOCTYPE html>
<html lang="es">
<head>

<title>Antepasados GALACHE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101318;

header{

nav{

  background:#171b21;
  border-bottom:1px solid #303640;
}

nav button{
  flex:1;
  min-width:90px;
  padding:13px 8px;
  border:0;
  background:none;
  color:#aaa;
  font-weight:bold;
}

nav button.active{
  background:#252b34;
  color:#fff;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.tab{display:none}
.tab.active{display:block}

.card{
  background:#1b2028;
  border:1px solid #303640;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

h2,h3{margin-top:0}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:12px 0 5px;
}

input,select,textarea{

  background:#101318;
  color:#fff;
  border:1px solid #39414c;
  border-radius:8px;
  font-size:15px;
}

textarea{

}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:600px){
  .row{grid-template-columns:1fr}
}

button{
  cursor:pointer;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  background:#368fe8;
  color:#fff;
  font-weight:bold;
}

.btn.green{background:#287b59}
.btn.red{background:#a43d3d}
.btn.gray{background:#39414c}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.relation{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

.person{
  background:#242a33;
  border:1px solid #343c48;
  border-radius:9px;
  padding:11px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.person small{
  display:block;
  color:#aaa;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-top:5px;
  border-radius:12px;
  background:#414954;
  font-size:11px;
}

.confirmado{background:#176342}
.probable{background:#715d1d}
.hipotesis{background:#674174}
.pendiente{background:#414954}

.tree{
  text-align:center;
  overflow:auto;
}

.tree-row{
  display:flex;
  justify-content:center;
  gap:10px;
  min-width:max-content;
  margin:10px 0;
}

.tree-box{
  width:180px;
  background:#242a33;
  border:1px solid #3a424d;
  border-radius:10px;
  padding:12px;
}

.tree-box strong{display:block}
.tree-box small{color:#aaa}

.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#242a33;
  border-radius:9px;
  text-align:center;
  padding:12px;
}

.stat b{
  display:block;
  font-size:24px;
}

.stat span{
  color:#aaa;
  font-size:12px;
}

.item{
  background:#242a33;
  padding:12px;
  border-radius:9px;
  margin-bottom:8px;
}

.muted{
  color:#aaa;
  font-size:13px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:100%;
  max-width:500px;
  background:#1b2028;
  border:1px solid #3a424d;
  border-radius:12px;
  padding:16px;

<script>

/* =====================================================
   BASE DE DATOS
===================================================== */

const STORAGE="antepasados_galache_v3";

let db={
  personas:[],
  fuentes:[],
  investigaciones:[]
};

let relacionPendiente="";


/* =====================================================
   UTILIDADES
===================================================== */

function idNuevo(){

return "p"+
Date.now()+
Math.random().toString(36).substring(2,7);

}


function nombrePersona(p){

return [
p.nombre,
p.apellidos
]
.filter(Boolean)
.join(" ")
.trim() || "Sin nombre";

}


function persona(id){

return db.personas.find(p=>p.id===id);

}


/* =====================================================
   GUARDAR
===================================================== */

function guardarDB(){

localStorage.setItem(
STORAGE,
JSON.stringify(db)
);

actualizarTodo();

}


/* =====================================================
   CARGAR
===================================================== */

function cargarDB(){

const datos=
localStorage.getItem(STORAGE);

if(datos){

try{

db=JSON.parse(datos);

}catch(e){

db={
personas:[],
fuentes:[],
investigaciones:[]
};

}

}

else{

crearDatosIniciales();

}

normalizar();

}


/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(){

if(!Array.isArray(db.personas))
db.personas=[];

if(!Array.isArray(db.fuentes))
db.fuentes=[];

if(!Array.isArray(db.investigaciones))
db.investigaciones=[];

db.personas.forEach(p=>{

if(!p.id)
p.id=idNuevo();

if(p.padre===undefined)
p.padre="";

if(p.madre===undefined)
p.madre="";

if(p.conyuge===undefined)
p.conyuge="";

});

}


/* =====================================================
   DATOS INICIALES
===================================================== */

function crearDatosIniciales(){

db={
personas:[],
fuentes:[],
investigaciones:[]
};


function crear(
nombre,
apellidos,
datos={}
){

const p={
id:idNuevo(),
nombre:nombre,
apellidos:apellidos,
variantes:"",
nacimiento:"",
lugarNacimiento:"",
bautismo:"",
lugarBautismo:"",
matrimonio:"",
lugarMatrimonio:"",
defuncion:"",
lugarDefuncion:"",
profesion:"",
residencia:"",
padre:"",
madre:"",
conyuge:"",
certeza:"Pendiente",
notas:"",
...datos
};

db.personas.push(p);

return p.id;

}


/* ===== PEDRO ===== */

const pedroRomero=crear(
"Pedro",
"Galache Romero",
{
nacimiento:"1897-06-29",
lugarNacimiento:"Genalguacil",
certeza:"Confirmado",
notas:
"Abuelo. Nacido el 29/06/1897 en Genalguacil. Punto de partida de la investigación."
}
);


const francisca=crear(
"Francisca",
"Rubio Rubio",
{
certeza:"Confirmado",
notas:"Esposa de Pedro Galache Romero."
}
);


/* ===== PEDRO AIREZ ===== */

const pedroAirez=crear(
"Pedro",
"Galache Airez",
{
variantes:"Airez / Aires / Airéz",
nacimiento:"1856-01-31",
lugarNacimiento:"Villavieja de Yeltes",
certeza:"Probable",
notas:
"Bisabuelo. Nacido el 31/01/1856 en Villavieja de Yeltes. La partida localizada coincide con los datos conocidos de Genalguacil."
}
);


/* ===== ISABEL ===== */

const isabel=crear(
"Isabel",
"Romero Sánchez",
{
nacimiento:"1862-01-01",
lugarNacimiento:"Genalguacil",
certeza:"Confirmado",
notas:"Bisabuela. Nacida en Genalguacil en 1862."
}
);


/* ===== CELESTINO ===== */

const celestino=crear(
"Celestino",
"Galache",
{
certeza:"Hipótesis",
notas:
"Existe discrepancia entre Celestino y Casimiro en la documentación matrimonial. Se investiga si el sacerdote pudo escribir Celestino por error."
}
);


const teodora=crear(
"Teodora",
"Ayres",
{
certeza:"Confirmado",
notas:"Esposa de Celestino Galache."
}
);


/* ===== FRANCISCO 1733 ===== */

const franciscoFraile=crear(
"Francisco",
"Galache Fraile",
{
nacimiento:"1705-01-01",
lugarNacimiento:"Ituero de Huebra",
matrimonio:"1733-05-04",
lugarMatrimonio:"Villares de Yeltes",
certeza:"Confirmado",
notas:
"Hijo legítimo de Francisco Galache y María Fraile. Contrajo matrimonio con María Melgar el 04/05/1733 en Villares de Yeltes."
}
);


const francisco=crear(
"Francisco",
"Galache",
{
certeza:"Confirmado",
notas:"Padre de Francisco Galache Fraile."
}
);


const mariaFraile=crear(

{

notas:"Madre de Francisco Galache Fraile."
}
);


const mariaMelgar=crear(
"María",
"Melgar",
{
matrimonio:"1733-05-04",
lugarMatrimonio:"Villares de Yeltes",
certeza:"Confirmado",
notas:
"Hija legítima de Mateo Melgar y Ana. Esposa de Francisco Galache Fraile."
}
);


const mateo=crear(
"Mateo",
"Melgar",
{
certeza:"Confirmado",
notas:"Padre de María Melgar."
}
);


const ana=crear(
"Ana",
"",
{
certeza:"Pendiente",
notas:
"Madre de María Melgar. Apellido pendiente de confirmar. Posiblemente Fernández, pero no confirmado."
}
);


const matheo=crear(
"Matheo",

{
nacimiento:"1743-01-01",
certeza:"Confirmado",

}

/* ===== VILLAVIEJA 1851 ===== */

const santiago1851=crear(

"Galache",
{

notas:
"Abuelo paterno de María bautizada en Villavieja de Yeltes en 1851."
}
);


const florentina=crear(

{
certeza:"Confirmado",

"Abuela paterna de María bautizada en Villavieja de Yeltes en 1851."

);


const manuel=crear(
"Manuel",

{
certeza:"Confirmado",
notas:
"Padre de María bautizada el 26/10/1851 en Villavieja de Yeltes."
}

const agustina=crear(

{
certeza:"Confirmado",
notas:

const maria1851=crear(
"María",
"",
{

certeza:"Confirmado",

"Nació el 22/10/1851 a la 1 de la noche. Hija legítima de Manuel Galache y Agustina Estévez. Abuelos paternos Santiago Galache y Florentina García."

/* ===== JOSEFA 1875 ===== */

const sebastian=crear(
"Sebastián",
"Galache",
{

notas:
"Abuelo de Josefa según partida de bautismo de 1875."
}

const dorotea=crear(

"Melgar",
{
certeza:"Confirmado",
notas:
"Abuela de Josefa según partida de bautismo de 1875."
}
);


const julian=crear(
"Julián",
"Galache",
{
certeza:"Confirmado",
notas:
"Padre de Josefa. Sus padres son Sebastián Galache y Dorotea Melgar."
}

const josefa=crear(

{

"Partida de bautismo de 1875. Hija de Julián Galache. Abuelos Sebastián Galache y Dorotea Melgar."

/* =====================================================
   RELACIONES CONFIRMADAS
===================================================== */

persona(pedroRomero).padre=pedroAirez;
persona(pedroRomero).madre=isabel;

persona(pedroRomero).conyuge=francisca;
persona(francisca).conyuge=pedroRomero;

persona(pedroAirez).conyuge=isabel;
persona(isabel).conyuge=pedroAirez;


/* Francisco + María */

persona(franciscoFraile).padre=francisco;
persona(franciscoFraile).madre=mariaFraile;
persona(franciscoFraile).conyuge=mariaMelgar;

persona(mariaMelgar).padre=mateo;
persona(mariaMelgar).madre=ana;
persona(mariaMelgar).conyuge=franciscoFraile;

persona(matheo).padre=franciscoFraile;
persona(matheo).madre=mariaMelgar;


/* Manuel */

persona(manuel).padre=santiago1851;
persona(manuel).madre=florentina;

persona(maria1851).padre=manuel;

/* Josefa */

persona(julian).padre=sebastian;
persona(julian).madre=dorotea;

persona(josefa).padre=julian;


/*
IMPORTANTE:

NO se conecta todavía:

Santiago → Celestino → Pedro Airez

porque esa conexión necesita más pruebas.
*/


db.investigaciones.push({

id:idNuevo(),

fecha:"2026-09-06",

titulo:
"Pedro Galache Airez — partida de 1856",

});

id:idNuevo(),

fecha:"2026-09-06",

texto:

db.investigaciones.push({

id:idNuevo(),

fecha:"2026-09-06",

/* =====================================================
   SELECTORES
===================================================== */

function cargarSelect(id,seleccion){

const s=document.getElementById(id);

if(!s)return;

s.innerHTML=
'<option value="">— Ninguno / pendiente —</option>';

db.personas
.sort((a,b)=>
nombrePersona(a).localeCompare(
nombrePersona(b),
"es"
))
.forEach(p=>{

const o=document.createElement("option");

o.value=p.id;
o.textContent=nombrePersona(p);

if(p.id===seleccion)
o.selected=true;

s.appendChild(o);

});

}


function actualizarSelectores(){

const padre=document.getElementById("padre")?.value;
const madre=document.getElementById("madre")?.value;
const conyuge=document.getElementById("conyuge")?.value;

cargarSelect("padre",padre);
cargarSelect("madre",madre);
cargarSelect("conyuge",conyuge);


const tree=document.getElementById("treeSelect");

if(tree){

const actual=tree.value;

tree.innerHTML="";

db.personas
.sort((a,b)=>
nombrePersona(a).localeCompare(
nombrePersona(b),
"es"
))
.forEach(p=>{

const o=document.createElement("option");

o.value=p.id;
o.textContent=nombrePersona(p);

o.selected=true;

tree.appendChild(o);

});

}

}

/* =====================================================
   GUARDAR PERSONA
===================================================== */

function guardarPersona(){

let id=document.getElementById("id").value;

let p=id?persona(id):null;

if(!id){

id=idNuevo();

p={
id:id,
nombre:"",
apellidos:"",
variantes:"",
nacimiento:"",
lugarNacimiento:"",
bautismo:"",
lugarBautismo:"",
matrimonio:"",
lugarMatrimonio:"",
defuncion:"",
lugarDefuncion:"",
profesion:"",
residencia:"",
padre:"",
madre:"",
conyuge:"",
certeza:"Pendiente",
notas:""
};

db.personas.push(p);

}


const antiguoConyuge=p.conyuge;


p.nombre=
document.getElementById("nombre").value.trim();

p.apellidos=
document.getElementById("apellidos").value.trim();

p.variantes=
document.getElementById("variantes").value.trim();

p.nacimiento=
document.getElementById("nacimiento").value;

p.lugarNacimiento=
document.getElementById("lugarNacimiento").value.trim();

p.bautismo=
document.getElementById("bautismo").value;

p.lugarBautismo=
document.getElementById("lugarBautismo").value.trim();

p.matrimonio=
document.getElementById("matrimonio").value;

p.lugarMatrimonio=
document.getElementById("lugarMatrimonio").value.trim();

p.defuncion=
document.getElementById("defuncion").value;

p.lugarDefuncion=
document.getElementById("lugarDefuncion").value.trim();

p.profesion=
document.getElementById("profesion").value.trim();

p.residencia=
document.getElementById("residencia").value.trim();

p.padre=
document.getElementById("padre").value;

p.madre=
document.getElementById("madre").value;

p.conyuge=
document.getElementById("conyuge").value;

p.certeza=
document.getElementById("certeza").value;

p.notas=
document.getElementById("notas").value.trim();


/* Enlace recíproco */

if(p.conyuge){

const c=persona(p.conyuge);

if(c)c.conyuge=p.id;

}


/* Quitar enlace antiguo */

if(
antiguoConyuge &&
antiguoConyuge!==p.conyuge
){

const anterior=persona(antiguoConyuge);

if(
anterior &&
anterior.conyuge===p.id
){

anterior.conyuge="";

}

}


guardarDB();

document.getElementById("id").value=p.id;

document.getElementById("tituloForm")
.textContent="Editar persona";

alert("Persona guardada.");

}


/* =====================================================
   ALTA RÁPIDA
===================================================== */

function altaRapida(tipo){

if(!document.getElementById("id").value){

alert(
"Primero guarda la persona principal."
);

return;

}

relacionPendiente=tipo;

let titulo="Nueva persona";

if(tipo==="padre")
titulo="➕ Nuevo padre";

if(tipo==="madre")
titulo="➕ Nueva madre";

if(tipo==="conyuge")
titulo="➕ Nuevo cónyuge";

document.getElementById("modalTitulo")
.textContent=titulo;

document.getElementById("nuevoNombre").value="";
document.getElementById("nuevoApellido").value="";
document.getElementById("nuevasNotas").value="";

document.getElementById("modal")
.classList.add("show");

document.getElementById("nuevoNombre")
.focus();

}


function cerrarModal(){

document.getElementById("modal")
.classList.remove("show");

relacionPendiente="";

}


function crearRelacion(){

const nombre=
document.getElementById("nuevoNombre")
.value.trim();

const apellidos=
document.getElementById("nuevoApellido")
.value.trim();

if(!nombre && !apellidos){

alert("Introduce nombre o apellidos.");

return;

}


const nuevo={

id:idNuevo(),

nombre:nombre,

apellidos:apellidos,

variantes:"",

nacimiento:"",
lugarNacimiento:"",
bautismo:"",
lugarBautismo:"",
matrimonio:"",
lugarMatrimonio:"",
defuncion:"",
lugarDefuncion:"",
profesion:"",
residencia:"",

padre:"",
madre:"",
conyuge:"",

certeza:"Pendiente",

notas:
document.getElementById("nuevasNotas")
.value.trim() ||
"Persona creada mediante alta rápida. Pendiente de documentar."

};


db.personas.push(nuevo);


const principal=
persona(
document.getElementById("id").value
);


if(relacionPendiente==="padre"){

principal.padre=nuevo.id;

}

if(relacionPendiente==="madre"){

principal.madre=nuevo.id;

}

if(relacionPendiente==="conyuge"){

principal.conyuge=nuevo.id;

nuevo.conyuge=principal.id;

}


guardarDB();

actualizarSelectores();


if(relacionPendiente==="padre")
document.getElementById("padre").value=nuevo.id;

if(relacionPendiente==="madre")
document.getElementById("madre").value=nuevo.id;

if(relacionPendiente==="conyuge")
document.getElementById("conyuge").value=nuevo.id;


cerrarModal();

}


/* =====================================================
   ELIMINAR
===================================================== */

function eliminarPersona(){

const id=
document.getElementById("id").value;

if(!id){

alert("No hay persona seleccionada.");

return;

}

const p=persona(id);

if(!p)return;

if(!confirm(
"¿Eliminar a "+nombrePersona(p)+"?"
))return;


db.personas=
db.personas.filter(x=>x.id!==id);


db.personas.forEach(x=>{

if(x.padre===id)x.padre="";
if(x.madre===id)x.madre="";
if(x.conyuge===id)x.conyuge="";

});


guardarDB();

limpiarFormulario();

listaPersonas();

actualizarSelectores();

dibujarArbol();

}


/* =====================================================
   LISTA PERSONAS
===================================================== */

function listaPersonas(){

const cont=
document.getElementById("personasLista");

const texto=
document.getElementById("buscar")
.value
.toLowerCase()
.trim();


let lista=
db.personas.filter(p=>
nombrePersona(p)
.toLowerCase()
.includes(texto)
);


lista.sort((a,b)=>
nombrePersona(a).localeCompare(
nombrePersona(b),
"es"
)
);


cont.innerHTML="";


lista.forEach(p=>{

const div=document.createElement("div");

div.className="person";

let clase=
(p.certeza||"Pendiente")
.toLowerCase()
.replace("ó","o")
.replace("í","i");


div.innerHTML=`

<div>

<strong>${nombrePersona(p)}</strong>

<small>
${p.nacimiento||""}
${p.lugarNacimiento ?
" · "+p.lugarNacimiento : ""}
</small>

${p.certeza||"Pendiente"}
</span>

</div>

<button class="btn"
onclick="editar('${p.id}')">
Editar
</button>

`;

cont.appendChild(div);

});

}


/* =====================================================
   ÁRBOL
===================================================== */

function cajaArbol(p){

if(!p)return "";

return `

<div class="tree-box">

<strong>${nombrePersona(p)}</strong>

<small>
${p.nacimiento||""}
${p.lugarNacimiento ?
" · "+p.lugarNacimiento : ""}
</small>

</div>

`;

}


function dibujarArbol(){

const id=
document.getElementById("treeSelect").value;

const cont=
document.getElementById("tree");

if(!id){

cont.innerHTML=
"<p class='muted'>Selecciona una persona.</p>";

return;

}


const p=persona(id);

if(!p)return;


let html=
`<div class="tree-row">
${cajaArbol(p)}
</div>`;


const padre=persona(p.padre);
const madre=persona(p.madre);


if(padre || madre){

html+=`

<div class="tree-row">

${cajaArbol(padre)}
${cajaArbol(madre)}

</div>

`;

}


let abuelos=[];


if(padre){

const a=persona(padre.padre);
const b=persona(padre.madre);

if(a)abuelos.push(a);
if(b)abuelos.push(b);

}


if(madre){

const a=persona(madre.padre);
const b=persona(madre.madre);

if(a)abuelos.push(a);
if(b)abuelos.push(b);

}


if(abuelos.length){

html+=`

<div class="tree-row">

${abuelos.map(cajaArbol).join("")}

</div>

`;

}


cont.innerHTML=html;

}

/* =====================================================
   COPIA
===================================================== */

function exportar(){

const datos=
JSON.stringify(db,null,2);

const blob=
new Blob(
[datos],
{type:"application/json"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"Antepasados_GALACHE.json";

a.click();

URL.revokeObjectURL(url);

}


function importar(event){

const archivo=
event.target.files[0];

if(!archivo)return;

const lector=
new FileReader();

lector.onload=function(){

try{

const datos=
JSON.parse(lector.result);

if(!datos.personas){

alert("Archivo no válido.");

return;

}


if(!confirm(
"Se sustituirán los datos actuales. ¿Continuar?"
))return;


db=datos;

normalizar();

guardarDB();

actualizarTodo();

alert("Copia importada correctamente.");

}catch(e){

alert("No se pudo importar el archivo.");

}

};

lector.readAsText(archivo);

}

function borrarTodo(){

if(!confirm(
"¿Borrar TODOS los datos?"
))return;

if(!confirm(
"Esta acción no se puede deshacer sin una copia."
))return;

localStorage.removeItem(STORAGE);

db={

};

actualizarTodo();

}

.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

.querySelectorAll(".nav")
.forEach(x=>
x.classList.remove("active")
);

.getElementById(id)
.classList.add("active");

boton.classList.add("active");

if(id==="investigacion")
mostrarInvestigaciones();

mostrarFuentes();

dibujarArbol();

}
