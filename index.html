<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Antepasados — GALACHE v3</title>

<style>
:root{
  --bg:#101318;
  --card:#1b2028;
  --card2:#222832;
  --text:#f1f3f5;
  --muted:#aab2bd;
  --accent:#4da3ff;
  --green:#42d392;
  --yellow:#f4c95d;
  --red:#ff6b6b;
  --border:#303844;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  padding:18px 14px;
  background:#151922;
  border-bottom:1px solid var(--border);
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

nav{
  display:flex;
  overflow-x:auto;
  background:#171b22;
  border-bottom:1px solid var(--border);
}

nav button{
  flex:1;
  min-width:90px;
  padding:13px 8px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-weight:bold;
}

nav button.active{
  color:white;
  background:var(--card2);
  border-bottom:2px solid var(--accent);
}

main{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.tab{
  display:none;
}

.tab.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

.card h2,
.card h3{
  margin-top:0;
}

label{
  display:block;
  margin-top:11px;
  margin-bottom:5px;
  color:var(--muted);
  font-size:13px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#11151b;
  color:white;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  background:var(--accent);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn.secondary{
  background:#303743;
}

.btn.green{
  background:#287f5c;
}

.btn.red{
  background:#a33d3d;
}

.btn.small{
  padding:8px 10px;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.relation{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:end;
}

.person-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.person-item{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.person-item strong{
  display:block;
}

.person-item small{
  color:var(--muted);
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  font-size:11px;
  margin-top:4px;
  background:#39414d;
}

.badge.confirmado{
  background:#176543;
}

.badge.probable{
  background:#6c591b;
}

.badge.hipotesis{
  background:#603f70;
}

.badge.pendiente{
  background:#424952;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:var(--card2);
  border-radius:10px;
  padding:15px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.tree{
  overflow-x:auto;
}

.tree-level{
  display:flex;
  gap:10px;
  justify-content:center;
  min-width:max-content;
  margin-bottom:12px;
}

.tree-person{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  width:180px;
  text-align:center;
}

.tree-person strong{
  display:block;
}

.tree-person small{
  color:var(--muted);
}

.note{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.source-item,
.research-item{
  padding:12px;
  background:var(--card2);
  border-radius:9px;
  margin-bottom:8px;
}

.source-item strong,
.research-item strong{
  display:block;
  margin-bottom:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:1000;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:20px;
}
</style>
</head>

  <p>Investigación genealógica GALACHE</p>
</header>
